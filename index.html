<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio de Projetos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Seção Principal (Hero) -->
    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-5 fw-bold">Meu Portfólio</h1>
            <a href="https://github.com/Rjyun10" id="github-profile-link" target="_blank" class="btn btn-github mt-2">
                <i class="fab fa-github"></i> Visitar meu GitHub
            </a>
        </div>
    </header>

    <!-- Seção de Projetos Unificada (Apenas GitHub) -->
    <main class="container my-5">
        <h2 class="h3 mb-4 text-center">Meus Projetos</h2>
        
        <!-- Container onde os projetos do GitHub aparecem -->
        <div id="projects-container" class="row g-4">
            <!-- Os cards aparecem aqui automaticamente -->
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="text-center py-4 border-top border-secondary text-muted">
        <p>&copy; 2026 - Meu Portfólio by Jyun</p>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript Personalizado -->
    <script src="script.js"></script>
</body>
</html>
